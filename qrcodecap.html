<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Capstone Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
            color: #ffffff;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #462697, #0b0617);
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            padding: 40px 35px;
            border-radius: 22px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 35px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 26px;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            margin-bottom: 26px;
        }

        .name-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Car Service &amp; Maintenance Reminder App</h1>
        <h2>Automated Testing using Appium &amp; Java</h2>

        <div class="subtitle">
            Capstone Project – QR Code Enabled Project Info
        </div>

        <div class="divider"></div>

        <div class="name-box">
            57152 – ABHISHEK SUMAN
        </div>
    </div>

</body>
</html>
